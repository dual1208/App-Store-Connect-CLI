name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      website_affected: ${{ steps.scope.outputs.website_affected }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only --no-renames "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          else
            files=""
          fi

          force_full=false
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*|scripts/ci_change_scope.py|scripts/test_ci_change_scope.py|scripts/test_ci_workflows.py)
                force_full=true
                ;;
            esac
          done <<< "$files"

          if [ "$force_full" = true ]; then
            selection="$(printf '%s\n' 'scope=full' 'website_affected=true')"
          else
            selection="$(printf '%s\n' "$files" | python3 scripts/ci_change_scope.py --github-output)"
          fi
          scope="$(printf '%s\n' "$selection" | sed -n 's/^scope=//p')"
          case "$scope" in
            docs|website|full) ;;
            *) echo "invalid CI scope: $scope" >&2; exit 1 ;;
          esac
          printf '%s\n' "$selection" >> "$GITHUB_OUTPUT"

  website-checks:
    needs: changes
    if: needs.changes.outputs.website_affected == 'true'
    uses: ./.github/workflows/website-checks.yml

  quality-checks:
    needs: changes
    if: contains(fromJSON('["docs", "full"]'), needs.changes.outputs.scope)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go tools
        id: go-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}

      - name: Install tooling
        if: steps.go-tools-cache.outputs.cache-hit != 'true'
        run: make tools

      - parallel:
          - name: Check formatting
            run: |
              export PATH="$(go env GOPATH)/bin:$PATH"
              make format-check

          - name: Self-test docs validators
            if: contains(fromJSON('["docs", "full"]'), needs.changes.outputs.scope)
            run: python3 scripts/test_check_docs.py

          - name: Check CI workflow contracts
            if: needs.changes.outputs.scope == 'full'
            run: python3 scripts/test_ci_workflows.py

          - name: Test CI change selection
            if: needs.changes.outputs.scope == 'full'
            run: python3 scripts/test_ci_change_scope.py

          - name: Check documentation
            if: contains(fromJSON('["docs", "full"]'), needs.changes.outputs.scope)
            run: make check-docs

          - name: Run lint
            if: contains(fromJSON('["full"]'), needs.changes.outputs.scope)
            run: |
              export PATH="$(go env GOPATH)/bin:$PATH"
              make lint

  format-and-lint:
    needs: [changes, quality-checks, website-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected quality checks
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "change detection result: ${{ needs.changes.result }}"
            exit 1
          fi

          case "${{ needs.changes.outputs.scope }}" in
            docs|full) required="${{ needs.quality-checks.result }}" ;;
            website) required="${{ needs.website-checks.result }}" ;;
            *) echo "unknown CI scope"; exit 1 ;;
          esac

          if [ "$required" != "success" ]; then
            echo "required quality result: $required"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.website_affected }}" = "true" ] && [ "${{ needs.website-checks.result }}" != "success" ]; then
            echo "website checks result: ${{ needs.website-checks.result }}"
            exit 1
          fi

  unit-test-shards:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    name: unit-test shard (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: packages
            command: go test -short ./cmd && python3 scripts/go_test_shard.py packages --packages ./... --exclude ./cmd --exclude ./internal/cli/cmdtest --exclude ./internal/cli/web --shard-index 0 --shard-total 1 -- -short
          - name: web 1/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/web --shard-index 0 --shard-total 2 -- -short
          - name: web 2/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/web --shard-index 1 --shard-total 2 -- -short
          - name: cmdtest 1/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/cmdtest --shard-index 0 --shard-total 2 -- -short
          - name: cmdtest 2/2
            command: python3 scripts/go_test_shard.py tests --package ./internal/cli/cmdtest --shard-index 1 --shard-total 2 -- -short
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go test shard
        run: |
          export ASC_BYPASS_KEYCHAIN=1
          export ASC_CONFIG_PATH="${RUNNER_TEMP}/asc-tests/config/config.json"
          export ASC_WEB_SESSION_CACHE_DIR="${RUNNER_TEMP}/asc-tests/web-sessions"
          export ASC_WEB_PASSWORD_STORE_DIR="${RUNNER_TEMP}/asc-tests/web-passwords"
          ${{ matrix.command }}

  unit-tests:
    needs: [changes, unit-test-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected tests
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "change detection result: ${{ needs.changes.result }}"
            exit 1
          fi

          case "${{ needs.changes.outputs.scope }}" in
            full)
              result="${{ needs.unit-test-shards.result }}"
              ;;
            *)
              echo "No general Go tests required for ${{ needs.changes.outputs.scope }} changes"
              exit 0
              ;;
          esac

          if [ "$result" != "success" ]; then
            echo "selected test result: $result"
            exit 1
          fi

  build-platforms:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            command: |
              GOOS=darwin GOARCH=amd64 go build -o build/asc_dev_macos_amd64 .
              GOOS=darwin GOARCH=arm64 go build -o build/asc_dev_macos_arm64 .
          - name: Linux
            runner: ubuntu-latest
            command: |
              GOOS=linux GOARCH=amd64 go build -o build/asc_dev_linux_amd64 .
              GOOS=linux GOARCH=arm64 go build -o build/asc_dev_linux_arm64 .
          - name: Windows
            runner: windows-latest
            command: GOOS=windows GOARCH=amd64 go build -o build/asc_dev_windows_amd64.exe .
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Create build directory
        run: mkdir -p build
        shell: bash

      - name: Build for ${{ matrix.name }}
        run: ${{ matrix.command }}
        shell: bash

  build:
    needs: [changes, build-platforms]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected builds
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "change detection result: ${{ needs.changes.result }}"
            exit 1
          fi

          case "${{ needs.changes.outputs.scope }}" in
            full) result="${{ needs.build-platforms.result }}" ;;
            *)
              echo "No CLI build required for ${{ needs.changes.outputs.scope }} changes"
              exit 0
              ;;
          esac

          if [ "$result" != "success" ]; then
            echo "selected build result: $result"
            exit 1
          fi
